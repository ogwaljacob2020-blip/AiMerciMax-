<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiMerci Max - Lesson Notes Generator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .meta-grid input, .meta-grid select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .note-block { margin-bottom: 18px; }
        .note-block label { display: block; font-weight: bold; margin-bottom: 6px; color: #1565c0; }
        .note-block textarea {
            width: 100%;
            min-height: 90px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            overflow-y: hidden;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
            .container { width: 100%; max-width: 100%; padding: 0; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LESSON NOTES</h1>
    <h2>AiMerci Max Studio</h2>

    <div id="notesSaveStatus">No draft saved yet</div>

    <h3>1. Context</h3>
    <div class="meta-grid">
        <div>
            <label>Institution Name</label>
            <input id="notesSchool" type="text" placeholder="Enter school name" oninput="saveNotesDraft()">
        </div>
        <div>
            <label>Instructor Name</label>
            <input id="notesTeacher" type="text" placeholder="Enter teacher name" oninput="saveNotesDraft()">
        </div>
        <div>
            <label>Subject</label>
            <input id="notesSubject" type="text" placeholder="e.g., Biology, History" oninput="saveNotesDraft()">
        </div>
        <div>
            <label>Class Level</label>
            <select id="notesClass" onchange="saveNotesDraft()">
                <option value="">Select Level</option>
                <option value="S.1">Senior 1 (S.1)</option>
                <option value="S.2">Senior 2 (S.2)</option>
                <option value="S.3">Senior 3 (S.3)</option>
                <option value="S.4">Senior 4 (S.4)</option>
                <option value="S.5">Senior 5 (S.5)</option>
                <option value="S.6">Senior 6 (S.6)</option>
            </select>
        </div>
    </div>

    <div class="note-block">
        <label>Topic</label>
        <input id="notesTopic" type="text" placeholder="e.g., The Water Cycle" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;" oninput="saveNotesDraft()">
    </div>

    <button class="no-print" style="background:#6a1b9a; color:white; border:none; width:100%; padding:14px; font-size:15px; font-weight:bold; border-radius:6px; cursor:pointer; margin-bottom:25px;" onclick="generateNotesAI()">
        ✨ Generate Notes with AiMerci
    </button>

    <div class="note-block">
        <label>Introduction</label>
        <textarea id="notesIntro" oninput="autoExpand(this); saveNotesDraft();" placeholder="Briefly introduce the topic and why it matters"></textarea>
    </div>

    <div class="note-block">
        <label>Key Definitions / Concepts</label>
        <textarea id="notesDefinitions" oninput="autoExpand(this); saveNotesDraft();" placeholder="List and define the key terms"></textarea>
    </div>

    <div class="note-block">
        <label>Main Content / Explanation</label>
        <textarea id="notesContent" oninput="autoExpand(this); saveNotesDraft();" placeholder="Detailed explanation of the topic"></textarea>
    </div>

    <div class="note-block">
        <label>Examples / Illustrations</label>
        <textarea id="notesExamples" oninput="autoExpand(this); saveNotesDraft();" placeholder="Worked examples, diagrams to draw, real-life illustrations"></textarea>
    </div>

    <div class="note-block">
        <label>Summary</label>
        <textarea id="notesSummary" oninput="autoExpand(this); saveNotesDraft();" placeholder="Key takeaways in a few sentences"></textarea>
    </div>

    <div class="note-block">
        <label>Assignment / Homework</label>
        <textarea id="notesAssignment" oninput="autoExpand(this); saveNotesDraft();" placeholder="Questions or tasks for learners to complete"></textarea>
    </div>

    <div class="button-group no-print" style="display:flex; gap:10px;">
        <button style="flex:1; padding:12px; background:#555; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="window.print()">🖨️ Print Notes</button>
        <button style="flex:1; padding:12px; background:#d32f2f; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="clearNotes()">🗑️ Clear/Reset</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
