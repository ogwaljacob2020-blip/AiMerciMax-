<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiMerci Max - Assessment Generator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .meta-grid input, .meta-grid select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; table-layout: fixed; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: left; vertical-align: top; }
        th { background: #e3f2fd; font-size: 12px; text-transform: uppercase; }
        th:nth-child(1) { width: 8%; }
        th:nth-child(3) { width: 10%; }
        td textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: none;
            overflow-y: hidden;
            font-family: inherit;
            font-size: 13px;
            min-height: 32px;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
            .container { width: 100%; max-width: 100%; padding: 0; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ASSESSMENT / EXAM</h1>
    <h2>AiMerci Max Studio</h2>

    <div id="assessmentSaveStatus">No draft saved yet</div>

    <h3>1. Context</h3>
    <div class="meta-grid">
        <div>
            <label>Institution Name</label>
            <input id="assessSchool" type="text" placeholder="Enter school name" oninput="saveAssessmentDraft()">
        </div>
        <div>
            <label>Instructor Name</label>
            <input id="assessTeacher" type="text" placeholder="Enter teacher name" oninput="saveAssessmentDraft()">
        </div>
        <div>
            <label>Subject</label>
            <input id="assessSubject" type="text" placeholder="e.g., Chemistry, English" oninput="saveAssessmentDraft()">
        </div>
        <div>
            <label>Class Level</label>
            <select id="assessClass" onchange="saveAssessmentDraft()">
                <option value="">Select Level</option>
                <option value="S.1">Senior 1 (S.1)</option>
                <option value="S.2">Senior 2 (S.2)</option>
                <option value="S.3">Senior 3 (S.3)</option>
                <option value="S.4">Senior 4 (S.4)</option>
                <option value="S.5">Senior 5 (S.5)</option>
                <option value="S.6">Senior 6 (S.6)</option>
            </select>
        </div>
        <div>
            <label>Duration</label>
            <input id="assessDuration" type="text" placeholder="e.g., 1 Hour 30 Minutes" oninput="saveAssessmentDraft()">
        </div>
        <div>
            <label>Total Marks</label>
            <input id="assessMarks" type="number" placeholder="e.g., 100" oninput="saveAssessmentDraft()">
        </div>
    </div>

    <div style="margin-bottom:15px;">
        <label style="font-weight:bold; color:#1565c0;">Topic(s) Covered</label>
        <input id="assessTopic" type="text" placeholder="e.g., Cell Structure and Function" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;" oninput="saveAssessmentDraft()">
    </div>

    <button class="no-print" style="background:#6a1b9a; color:white; border:none; width:100%; padding:14px; font-size:15px; font-weight:bold; border-radius:6px; cursor:pointer; margin-bottom:20px;" onclick="generateAssessmentAI()">
        ✨ Generate Assessment with AiMerci
    </button>

    <h3>2. Questions</h3>
    <table id="assessmentTable">
        <thead>
            <tr>
                <th>No.</th>
                <th>Question</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody id="assessmentBody">
            <tr>
                <td><textarea oninput="autoExpand(this); saveAssessmentDraft();"></textarea></td>
                <td><textarea oninput="autoExpand(this); saveAssessmentDraft();"></textarea></td>
                <td><textarea oninput="autoExpand(this); saveAssessmentDraft();"></textarea></td>
            </tr>
        </tbody>
    </table>

    <button class="no-print" onclick="addQuestionRow()">+ Add Question</button>

    <div class="button-group no-print" style="display:flex; gap:10px; margin-top:10px;">
        <button style="flex:1; padding:12px; background:#4caf50; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="downloadAssessmentCSV()">⬇️ Download CSV</button>
        <button style="flex:1; padding:12px; background:#555; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="window.print()">🖨️ Print</button>
        <button style="flex:1; padding:12px; background:#d32f2f; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="clearAssessment()">🗑️ Clear/Reset</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
