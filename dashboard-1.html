<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiMerci Max Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 700px; }
        .cards { display: grid; gap: 15px; padding: 15px; max-width: 700px; margin: 0 auto; }
    </style>
</head>
<body>

<div class="app-header">
    <div>
        <div class="app-title">AiMerci Max</div>
        <div class="app-subtitle" id="greeting">Teacher AI Assistant</div>
    </div>
</div>

<div class="cards">

    <div class="card">
        📘 Scheme of Work Generator
        <br>
        <button onclick="location.href='scheme.html'">Open</button>
    </div>

    <div class="card">
        📝 Lesson Plan Creator
        <br>
        <button onclick="location.href='lessonplan.html'">Open</button>
    </div>

    <div class="card">
        📚 Notes Generator
        <br>
        <button onclick="location.href='notes.html'">Open</button>
    </div>

    <div class="card">
        📋 Assessment Generator
        <br>
        <button onclick="location.href='assessment.html'">Open</button>
    </div>

</div>

<script>
let account = JSON.parse(localStorage.getItem("aimerciAccount") || "null");
if (account && account.name) {
    document.getElementById("greeting").textContent = "Welcome back, " + account.name;
}
</script>

</body>
</html>
